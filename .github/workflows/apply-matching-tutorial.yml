name: Integrate Matching Tutorial

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-matching-tutorial.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate tutorial JavaScript
        run: node --check matching-tutorial.js
      - name: Load tutorial after the authoritative game runtimes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          script = '  <script src="matching-tutorial.js?v=20260731-1"></script>\n'
          marker = '  <script src="mode-one-letter-continuity-v1.js?v=20260726-authoritative-max-logic-2"></script>\n'
          if script not in text:
              if marker not in text:
                  raise SystemExit('Authoritative runtime marker not found')
              text = text.replace(marker, marker + script, 1)
          if text.count(script) != 1:
              raise SystemExit('Matching Tutorial script must appear exactly once')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Remove one-time integration workflow
        run: rm .github/workflows/apply-matching-tutorial.yml
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/apply-matching-tutorial.yml
          git commit -m "Load the Matching Tutorial beneath the response matrix"
          git push origin HEAD:main
