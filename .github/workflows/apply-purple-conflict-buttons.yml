name: Apply purple conflict-button styling

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-purple-conflict-buttons.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace only the red negative-button rule
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '.conflict-choice[data-value="0"]{background:#fff0ef;color:#a61f17;border:2px solid #d78b86}'
          new = '.conflict-row:not([data-decision="3"]) .conflict-choice[data-value="0"]:not(.feedback-correct):not(.feedback-incorrect){background:#F1E4FF!important;color:#6818A5!important;border:2px solid #B96AF4!important}'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one red negative-button rule, found {count}.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit the isolated CSS change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Use distinctive light purple for negative conflict buttons"
          git push origin HEAD:main
