name: Focused production-composition smoke

on:
  pull_request:
    paths:
      - .github/workflows/focused-interference-smoke.yml
      - tests/interference-smoke.mjs
      - mode-one-completion-v11.js
      - mode-one-letter-continuity-v1.js
      - mode-one-conflict-matrix-v20.js
      - mode-two-ontology-nback-v14.js
      - index.html
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/complete-max-interference-100
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Delegate Mode 2 directly from the authoritative runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('mode-one-letter-continuity-v1.js')
          text = path.read_text(encoding='utf-8')
          old = """      if (mode !== 0) return originalMakeTrial();
      const settings = this.settings();
"""
          new = """      if (mode !== 0) {
        if (mode === 1) {
          const modeTwo = rootObject.__modeTwoOntologyNBackV14;
          if (!modeTwo?.generateTrial || !modeTwo?.generateNBackTrial) {
            throw new Error('Mode 2 canonical generator is unavailable.');
          }
          const modeTwoSettings = this.settings();
          const modeTwoLevel = Math.max(1, Math.min(8, Math.round(Number(this.n || modeTwoSettings.n) || 1)));
          const modeTwoHistory = Array.isArray(this.trials) ? this.trials : [];
          const modeTwoTarget = modeTwoHistory[modeTwoHistory.length - modeTwoLevel] || null;
          if (!modeTwoTarget) {
            const warmup = modeTwo.generateTrial(this.rng, { matchProbability: this.rng.next() < 0.5 ? 1 : 0 });
            warmup.nBackWarmup = true;
            warmup.scored = false;
            return warmup;
          }
          return modeTwo.generateNBackTrial(this.rng, modeTwoTarget, {
            match: this.rng.next() < modeTwoSettings.matchProbability,
            nBackLevel: modeTwoLevel
          });
        }
        return originalMakeTrial();
      }
      const settings = this.settings();
"""
          if old in text:
              text = text.replace(old, new, 1)
          if 'Mode 2 canonical generator is unavailable.' not in text:
              raise SystemExit('Direct Mode 2 delegation patch failed')
          path.write_text(text, encoding='utf-8')
          PY
          node --check mode-one-letter-continuity-v1.js
      - run: npm install --no-save jsdom@26
      - name: Run focused smoke and retain full output
        shell: bash
        run: |
          set +e
          node tests/interference-smoke.mjs > interference-smoke.log 2>&1
          code=$?
          set -e
          cat interference-smoke.log
          echo "$code" > interference-smoke.exit
          exit "$code"
      - name: Commit canonical Mode 2 delegation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mode-one-letter-continuity-v1.js
          git diff --cached --quiet && exit 0
          git commit -m "Delegate Mode 2 directly from maximum runtime"
          git push origin HEAD:agent/complete-max-interference-100
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focused-interference-smoke
          path: |
            interference-smoke.log
            interference-smoke.exit
            mode-one-letter-continuity-v1.js
          if-no-files-found: error
