name: Focused production-composition smoke

on:
  pull_request:
    paths:
      - .github/workflows/focused-interference-smoke.yml
      - tests/interference-smoke.mjs
      - mode-one-completion-v11.js
      - mode-one-letter-continuity-v1.js
      - mode-one-conflict-matrix-v20.js
      - mode-two-ontology-nback-v14.js
      - index.html
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save jsdom@26
      - name: Add local delegation diagnostic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/interference-smoke.mjs')
          text = path.read_text(encoding='utf-8')
          marker = "assert.equal(modeTwoTrial.mode, 1);\n"
          diagnostic = "assert.equal(modeTwoTrial.mode, 1);\nconsole.error('MODE_TWO_TRIAL_DIAGNOSTIC', JSON.stringify({ keys: Object.keys(modeTwoTrial), trial: modeTwoTrial, makeTrialSource: app.makeTrial.toString().slice(0, 500) }));\n"
          if marker not in text:
              raise SystemExit('Mode 2 diagnostic marker missing')
          path.write_text(text.replace(marker, diagnostic, 1), encoding='utf-8')
          PY
      - name: Run focused smoke and retain full output
        shell: bash
        run: |
          set +e
          node tests/interference-smoke.mjs > interference-smoke.log 2>&1
          code=$?
          set -e
          cat interference-smoke.log
          echo "$code" > interference-smoke.exit
          exit "$code"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focused-interference-smoke
          path: |
            interference-smoke.log
            interference-smoke.exit
          if-no-files-found: error
