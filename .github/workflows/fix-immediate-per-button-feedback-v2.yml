name: Mode 1 immediate feedback regression

on:
  push:
    branches: [main]
    paths:
      - mode-one-conflict-matrix-v20.js
      - audio-accessibility.js
      - app.js
      - index.html
      - tests/mode-one-browser-contract-v21.test.js
      - tests/production-runtime-regression.test.js
      - .github/workflows/fix-immediate-per-button-feedback-v2.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Verify per-decision feedback and submission
        run: node --test tests/mode-one-browser-contract-v21.test.js tests/production-runtime-regression.test.js
