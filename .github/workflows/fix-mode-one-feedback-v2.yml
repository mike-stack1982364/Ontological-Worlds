name: Fix Mode 1 feedback v2

on:
  push:
    paths:
      - .github/workflows/fix-mode-one-feedback-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-feedback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace Mode 1 feedback rendering with inline SVG overlays
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('mode-one-conflict-matrix-v20.js')
          text = path.read_text(encoding='utf-8')

          old_css = ".conflict-feedback-icon{position:absolute;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;font-size:clamp(2.3rem,3.5vw,3.8rem);font-weight:1000;line-height:1;background:rgba(255,255,255,.72);animation:conflict-feedback-pop .82s ease-out both;pointer-events:none}.conflict-feedback-icon.correct{color:#087a3f}.conflict-feedback-icon.incorrect{color:#b42318}@keyframes conflict-feedback-pop{0%{opacity:0;transform:scale(.35)}22%{opacity:1;transform:scale(1.22)}55%{transform:scale(.94)}100%{opacity:1;transform:scale(1)}}"
          new_css = ".conflict-feedback-icon{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:rgba(255,255,255,.9);animation:conflict-feedback-pop .72s ease-out both;pointer-events:none}.conflict-feedback-icon svg{display:block;width:min(52%,64px);height:min(52%,64px);overflow:visible}.conflict-feedback-icon.correct{color:#087a3f}.conflict-feedback-icon.incorrect{color:#b42318}@keyframes conflict-feedback-pop{0%{opacity:0;transform:scale(.28)}24%{opacity:1;transform:scale(1.2)}58%{transform:scale(.96)}100%{opacity:1;transform:scale(1)}}"
          if old_css not in text:
              raise SystemExit('Expected feedback CSS not found')
          text = text.replace(old_css, new_css, 1)

          text = text.replace(".conflict-feedback-icon{font-size:2.25rem}", ".conflict-feedback-icon svg{width:min(58%,54px);height:min(58%,54px)}", 1)

          old_icon = "const icon=d.createElement('span');\n        icon.className=`conflict-feedback-icon ${correct?'correct':'incorrect'}`;\n        icon.textContent=correct?'✓':'✕';\n        icon.setAttribute('aria-hidden','true');\n        button.appendChild(icon);"
          new_icon = "const icon=d.createElement('span');\n        icon.className=`conflict-feedback-icon ${correct?'correct':'incorrect'}`;\n        icon.setAttribute('aria-hidden','true');\n        icon.innerHTML=correct\n          ? '<svg viewBox=\"0 0 64 64\" role=\"presentation\"><path d=\"M13 33l12 12L52 18\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>'\n          : '<svg viewBox=\"0 0 64 64\" role=\"presentation\"><path d=\"M17 17l30 30M47 17L17 47\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"9\" stroke-linecap=\"round\"/></svg>';\n        button.appendChild(icon);"
          if old_icon not in text:
              raise SystemExit('Expected icon creation block not found')
          text = text.replace(old_icon, new_icon, 1)

          duplicate = "matrix.showFeedback(correctness,responses);\n      matrix.showFeedback(correctness,responses);"
          if duplicate in text:
              text = text.replace(duplicate, "matrix.showFeedback(correctness,responses);", 1)

          text = text.replace("return Object.freeze({version:32,", "return Object.freeze({version:33,", 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate repaired implementation
        run: |
          node --check mode-one-conflict-matrix-v20.js
          grep -F "<svg viewBox=\"0 0 64 64\"" mode-one-conflict-matrix-v20.js
          test "$(grep -o "matrix.showFeedback(correctness,responses);" mode-one-conflict-matrix-v20.js | wc -l)" -eq 1
      - name: Commit patched implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mode-one-conflict-matrix-v20.js
          git diff --cached --quiet && exit 0
          git commit -m "Render Mode 1 feedback with inline SVG icons"
          git push origin HEAD:main
