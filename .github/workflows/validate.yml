name: Validate training modes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install reproducible test dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: |
          for file in *.js tests/*.js tests/helpers/*.cjs; do node --check "$file"; done
      - name: Run logic audits and production-page regressions
        run: npm test
