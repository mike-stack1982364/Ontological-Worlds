name: Validate logic engines

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  startup-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check production startup JavaScript syntax
        run: |
          node --check app.js
          node --check mode-one-match-logic.js
          node --check mode-one-spatial-core.js
          node --check mode-router-v2.js
          node --check mode-two-ontology-nback-v14.js
          node --check audio-accessibility.js
          node --check mode-one-conflict-matrix-v20.js
          node --check mode-one-startup-coordinator.js
          node --check tests/mode-one-startup-e2e.mjs
      - name: Install DOM test runtime
        run: npm install --no-save jsdom@26
      - name: Prove Start countdown renders Trial 1
        run: node tests/mode-one-startup-e2e.mjs 2>&1 | tee mode-one-startup-output.txt
      - name: Upload startup regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mode-one-startup-regression-output
          path: mode-one-startup-output.txt

  legacy-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check legacy JavaScript syntax
        run: |
          node --check mode-release-gate.js
          node --check audio-only-display.js
          node --check response-window.js
          node --check ontology-integration-v4.js
          node --check mode-one-triadic.js
          node --check cognitive-interference-v3.js
          node --check mode-one-interference.js
          node --check mode-one-approved-trials-v4.js
          node --check mode-one-approved-trials-v6.js
          node --check mode-one-approved-trials-v7.js
          node --check mode-one-nback-v8.js
          node --check mode-one-nback-v9.js
          node --check mode-one-nback-v10.js
          node --check mode-one-nback-v11.js
          node --check mode-one-completion-v10.js
          node --check mode-one-completion-v11.js
      - name: Install DOM test runtime
        run: npm install --no-save jsdom@26
      - name: Run legacy relational logic smoke tests
        run: node tests/interference-smoke.mjs
      - name: Run complete-profile N-back browser smoke test
        run: node tests/profile-nback-browser-smoke.mjs
      - name: Run level-specific 80-case browser runtime
        run: node tests/level-curriculum-browser-smoke.mjs
      - name: Run level-specific 160-case meta-curriculum runtime
        run: node tests/meta-curriculum-browser-smoke.mjs
