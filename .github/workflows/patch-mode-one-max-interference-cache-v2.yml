name: Patch Mode 1 maximum-interference cache key

on:
  push:
    branches:
      - agent/enforce-authoritative-max-logical-interference
    paths:
      - .github/workflows/patch-mode-one-max-interference-cache-v2.yml

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/enforce-authoritative-max-logical-interference
      - name: Bump authoritative maximum-interference runtime cache key
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '<script src="mode-one-letter-continuity-v1.js?v=20260726-partial-letter-update-1"></script>'
          new = '<script src="mode-one-letter-continuity-v1.js?v=20260726-authoritative-max-logic-2"></script>'
          if old not in text:
              raise SystemExit('Expected Mode 1 continuity script tag was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/patch-mode-one-max-interference-cache-v2.yml
      - name: Commit cache-key update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/patch-mode-one-max-interference-cache-v2.yml
          git commit -m "Bump Mode 1 maximum-interference cache key"
          git push origin HEAD:agent/enforce-authoritative-max-logical-interference
