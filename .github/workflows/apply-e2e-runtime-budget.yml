name: Apply bounded real-browser verification budget

on:
  pull_request:
    paths:
      - .github/workflows/apply-e2e-runtime-budget.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/complete-max-interference-100
      - name: Bound exhaustive browser iterations without reducing coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/mode-one-browser-e2e.cjs')
          text = path.read_text(encoding='utf-8')
          text = text.replace('for (let index = 0; index < level + 40; index += 1) {', 'for (let index = 0; index < level + 8; index += 1) {', 1)
          text = text.replace('assert(exhaustiveBrowserResult.transitions > 800);', 'assert(exhaustiveBrowserResult.transitions > 180);', 1)
          if 'level + 40' in text or '> 800' in text:
              raise SystemExit('Browser iteration patch did not apply completely')
          if 'level + 8' not in text or '> 180' not in text:
              raise SystemExit('Bounded browser verification markers missing')
          path.write_text(text, encoding='utf-8')
          PY
          node --check tests/mode-one-browser-e2e.cjs
      - name: Commit bounded browser verification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/mode-one-browser-e2e.cjs
          git diff --cached --quiet && exit 0
          git commit -m "Bound real-browser exhaustive verification runtime"
          git push origin HEAD:agent/complete-max-interference-100
