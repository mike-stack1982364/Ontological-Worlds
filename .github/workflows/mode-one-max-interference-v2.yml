name: Mode 1 maximum logical interference

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-max-interference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check maximum-interference runtime syntax
        run: node --check mode-one-letter-continuity-v1.js
      - name: Validate N=1–8 partial identity updates and exact logical lures
        run: node tests/mode-one-max-interference-v2.test.js
