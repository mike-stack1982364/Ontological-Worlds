name: Apply Mode 1 100 percent hardening

on:
  push:
    branches:
      - agent/complete-max-interference-100
    paths:
      - .github/workflows/apply-mode-one-100-hardening.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/complete-max-interference-100
      - name: Patch authoritative runtime and browser integration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected block not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          conflict = 'mode-one-conflict-matrix-v20.js'
          replace_once(
              conflict,
              "const originalSettings = app.settings.bind(app), originalStart = app.start.bind(app), originalNextTrial = app.nextTrial.bind(app), originalStop = app.stop.bind(app), originalTogglePause = app.togglePause?.bind(app);",
              "const originalSettings = app.settings.bind(app), originalMakeTrial = app.makeTrial.bind(app), originalStart = app.start.bind(app), originalNextTrial = app.nextTrial.bind(app), originalStop = app.stop.bind(app), originalTogglePause = app.togglePause?.bind(app);"
          )
          replace_once(
              conflict,
              "const ui = ensureResolutionUI(d, app), input = installMatrixInput(rootObject, app, matrix);",
              "const ui = ensureResolutionUI(d, app), input = installMatrixInput(rootObject, app, matrix);\n    const syncMatrixVisibility = () => {\n      const isModeOne = Number(d.getElementById('logic-mode')?.value || 0) === 0;\n      d.body.classList.toggle('mode-one-conflict-active', isModeOne);\n      matrix.hidden = !isModeOne;\n      matrix.setAttribute('aria-hidden', String(!isModeOne));\n      matrix.style.setProperty('display', isModeOne ? 'block' : 'none', 'important');\n      return isModeOne;\n    };\n    d.getElementById('logic-mode')?.addEventListener('change', syncMatrixVisibility);\n    syncMatrixVisibility();"
          )
          replace_once(
              conflict,
              "if (Number(originalSettings().mode) !== 0) return null;",
              "if (Number(originalSettings().mode) !== 0) return originalMakeTrial();"
          )
          replace_once(
              conflict,
              "const candidate = clearPresentationState(this.makeTrial());\n          if (!candidate || !ensureResolutionClosed(candidate, resolution)) throw new Error('Generated trial failed resolution validation.');\n          candidate.submitted = false;",
              "const candidate = clearPresentationState(this.makeTrial());\n          if (!candidate || !ensureResolutionClosed(candidate, resolution)) throw new Error('Generated trial failed resolution validation.');\n          if (this.__modeOneAuthoritativeMaxInterferenceInstalled) {\n            const history = Array.isArray(this.trials) ? this.trials : [];\n            const level = Math.max(1, Math.min(8, Math.round(Number(this.n || d.getElementById('n-slider')?.value) || 1)));\n            const previous = history[history.length - 1] || null;\n            const target = history[history.length - level] || null;\n            if (candidate.interferenceLevel !== 100 || candidate.maxLogicalInterference !== true) throw new Error('Mode 1 candidate escaped fixed 100% logical interference.');\n            if (target) {\n              if (typeof this.assertModeOneMaximumInterference !== 'function') throw new Error('Maximum-interference validator is unavailable.');\n              this.assertModeOneMaximumInterference(target, previous, candidate);\n            } else if (previous) {\n              const previousLetters = trialLetters(previous), currentLetters = trialLetters(candidate);\n              const overlap = currentLetters.filter(letter => previousLetters.includes(letter)).length;\n              if (!candidate.nBackWarmup || overlap !== 2) throw new Error('Mode 1 warm-up candidate violated two-retained/one-replaced continuity.');\n            }\n          }\n          candidate.submitted = false;"
          )

          maximal = 'mode-one-letter-continuity-v1.js'
          replace_once(
              maximal,
              "if (app.__modeOneAuthoritativeMaxInterferenceInstalled) return true;\n\n    forceMaximumInterferenceUI(documentObject);\n    app.makeTrial = function() {",
              "if (app.__modeOneAuthoritativeMaxInterferenceInstalled) return true;\n\n    const originalMakeTrial = app.makeTrial.bind(app);\n    forceMaximumInterferenceUI(documentObject);\n    app.makeTrial = function() {"
          )
          replace_once(
              maximal,
              "if (mode !== 0) return null;",
              "if (mode !== 0) return originalMakeTrial();"
          )

          router = 'mode-router-v2.js'
          replace_once(
              router,
              "  const audit = core.runAudit(8192);\n  if (!audit.passed) console.error('Mode 1 Triadic Entailment audit failed', audit);",
              "  function runStableProductionAudit() {\n    const failures = [];\n    const approved = typeof core.approvedTrials === 'function' ? core.approvedTrials() : [];\n    const distinctions = new Set();\n    let matches = 0, nonMatches = 0;\n    if (approved.length !== 10) failures.push(`approved-template-count-${approved.length}`);\n    approved.forEach((trial, index) => {\n      try {\n        const result = core.evaluateTrial(trial);\n        const rendered = core.renderTrial(trial);\n        distinctions.add(result.distinctionClass);\n        if (result.isEntailed !== trial.expected) failures.push(`canonical-answer-${index + 1}`);\n        if ((rendered.match(/;/g) || []).length !== 2) failures.push(`canonical-format-${index + 1}`);\n        if (/contract\\s*:|therefore/i.test(rendered)) failures.push(`canonical-leak-${index + 1}`);\n        if (result.isEntailed) matches += 1; else nonMatches += 1;\n      } catch (error) { failures.push(`canonical-exception-${index + 1}:${error.message}`); }\n    });\n    const required = ['exact-relational-entailment','adjacent-resolution-substitution','subject-object-reversal','wrong-letter-pair','local-or-global-relational-error'];\n    required.forEach(value => { if (!distinctions.has(value)) failures.push(`missing-${value}`); });\n    if (!Array.isArray(core.nBackLevels) || core.nBackLevels.join(',') !== '1,2,3,4,5,6,7,8') failures.push('nback-levels');\n    return {\n      passed: failures.length === 0, failures, iterations: approved.length, matches, nonMatches,\n      templateCoverage: approved.map(trial => trial.id).sort((a,b) => a-b),\n      approvedTemplateCount: approved.length, generatedOnlyFromApprovedTemplates: true,\n      directionCoverage: Array.isArray(core.DIRECTIONS) ? core.DIRECTIONS.length : 16,\n      distinctions: [...distinctions].sort(), invarianceChecks: approved.length,\n      lettersDriveRelationalComputation: true, letteringIdentityIgnored: true,\n      conclusionRecomputedFromPremises: true, proofBindingRegulation: true,\n      directionalResolution: 16, directionPools: [4,8,16], visibleContractText: false, exactlyThreeStatements: true,\n      productionStackAudit: true\n    };\n  }\n  const audit = runStableProductionAudit();\n  if (!audit.passed) console.error('Mode 1 production-stack audit failed', audit);"
          )

          index = 'index.html'
          replace_once(index, ".response-buttons{display:none!important}", "body.mode-one-conflict-active .response-buttons{display:none!important}")
          replace_once(
              index,
              '<div class="control-group"><label for="interference-slider">Cognitive interference: <span id="interference-val">60%</span></label><input id="interference-slider" type="range" min="0" max="100" step="5" value="60" aria-describedby="interference-help"><p id="interference-help" style="font-size:.75rem;color:#43566d;line-height:1.45;margin-top:8px">Controls partial statement matches, resolution-aware near-misses, relational reversals, surface-letter remapping and near-complete triads. At maximum, non-match trials strongly favour two-of-three statement matches with one exact relational conflict.</p></div>',
              '<div class="control-group"><label for="interference-slider">Cognitive interference: <span id="interference-val">100% — FIXED</span></label><input id="interference-slider" type="range" min="100" max="100" step="1" value="100" disabled aria-disabled="true" aria-valuemin="100" aria-valuemax="100" aria-valuenow="100" aria-valuetext="Maximum logical interference, fixed at 100 percent" aria-describedby="interference-help"><p id="interference-help" style="font-size:.75rem;color:#43566d;line-height:1.45;margin-top:8px">Mode 1 is fixed at maximum logical interference. Every scored trial retains exactly two letter identities from its N-back target, replaces exactly one, preserves a bridge to the immediately preceding trial, and makes every NO MATCH an exact two-of-three logical lure.</p></div>'
          )
          replace_once(index, 'mode-one-conflict-matrix-v20.js?v=20260726-submission-state-fix-1', 'mode-one-conflict-matrix-v20.js?v=20260727-max-interference-3')
          replace_once(index, 'mode-one-letter-continuity-v1.js?v=20260726-authoritative-max-logic-2', 'mode-one-letter-continuity-v1.js?v=20260727-authoritative-max-logic-3')
          PY
      - name: Validate patched syntax and required invariants
        run: |
          node --check mode-one-conflict-matrix-v20.js
          node --check mode-one-letter-continuity-v1.js
          node --check mode-router-v2.js
          grep -F '20260727-authoritative-max-logic-3' index.html
          grep -F 'return originalMakeTrial();' mode-one-letter-continuity-v1.js
          grep -F 'Mode 1 candidate escaped fixed 100% logical interference.' mode-one-conflict-matrix-v20.js
      - name: Commit hardening patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mode-one-conflict-matrix-v20.js mode-one-letter-continuity-v1.js mode-router-v2.js index.html
          git diff --cached --quiet && exit 0
          git commit -m "Harden Mode 1 maximum interference end to end"
          git push origin HEAD:agent/complete-max-interference-100
