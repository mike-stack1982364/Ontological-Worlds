name: Mode 2 Deep Validation

on:
  pull_request:
    paths:
      - 'mode-two-ontology-nback-v14.js'
      - 'mode-one-spatial-core.js'
      - 'tests/mode-two-ontology-nback-v14.test.js'
      - 'tests/mode-two-ontology-nback-deep-v15.test.js'
      - '.github/workflows/mode-two-deep-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-mode-two:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run canonical Mode 2 audit with full diagnostics
        shell: bash
        run: |
          set -o pipefail
          node --trace-uncaught tests/mode-two-ontology-nback-v14.test.js 2>&1 | tee mode-two-canonical.log

      - name: Upload canonical diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mode-two-canonical-diagnostics
          path: mode-two-canonical.log
          if-no-files-found: warn

  deep-mode-two:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run deep Mode 2 audit with full diagnostics
        shell: bash
        run: |
          set -o pipefail
          node --trace-uncaught tests/mode-two-ontology-nback-deep-v15.test.js 2>&1 | tee mode-two-deep.log

      - name: Upload deep diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mode-two-deep-diagnostics
          path: mode-two-deep.log
          if-no-files-found: warn
