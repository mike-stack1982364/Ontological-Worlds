name: Apply blue-green response palette

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-blue-green-response-palette.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply isolated live-button and tutorial palette changes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(source, old, new, label):
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one occurrence, found {count}.')
              return source.replace(old, new, 1)

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          index = replace_once(
              index,
              '    .conflict-choice[data-value="1"]{background:#e9f8ef;color:#086b3a;border:2px solid #55a879}',
              '\n'.join([
                  '    .conflict-row[data-decision="0"] .conflict-choice[data-value="1"]:not(.feedback-correct):not(.feedback-incorrect),',
                  '    .conflict-row[data-decision="1"] .conflict-choice[data-value="1"]:not(.feedback-correct):not(.feedback-incorrect),',
                  '    .conflict-row[data-decision="2"] .conflict-choice[data-value="1"]:not(.feedback-correct):not(.feedback-incorrect){background:#D9F0FF!important;color:#08385F!important;border:2px solid #5AB5E6!important}'
              ]),
              'A/D/H light-blue rule'
          )
          index = replace_once(
              index,
              '\n'.join([
                  '    .conflict-row[data-decision="0"] .conflict-choice[data-value="0"]:not(.feedback-correct):not(.feedback-incorrect),',
                  '    .conflict-row[data-decision="1"] .conflict-choice[data-value="0"]:not(.feedback-correct):not(.feedback-incorrect),',
                  '    .conflict-row[data-decision="2"] .conflict-choice[data-value="0"]:not(.feedback-correct):not(.feedback-incorrect){background:#5B21B6!important;color:#FFFFFF!important;border:2px solid #3B0764!important}'
              ]),
              '\n'.join([
                  '    .conflict-row[data-decision="0"] .conflict-choice[data-value="0"]:not(.feedback-correct):not(.feedback-incorrect),',
                  '    .conflict-row[data-decision="1"] .conflict-choice[data-value="0"]:not(.feedback-correct):not(.feedback-incorrect),',
                  '    .conflict-row[data-decision="2"] .conflict-choice[data-value="0"]:not(.feedback-correct):not(.feedback-incorrect){background:#123A6D!important;color:#FFFFFF!important;border:2px solid #082A52!important}'
              ]),
              'S/F/J dark-blue rule'
          )
          index = replace_once(
              index,
              '    .conflict-row[data-decision="3"] .conflict-choice[data-value="1"]:not(.feedback-correct):not(.feedback-incorrect){background:#D7F2FF!important;color:#08385F!important;border:2px solid #58B8E8!important}',
              '    .conflict-row[data-decision="3"] .conflict-choice[data-value="1"]:not(.feedback-correct):not(.feedback-incorrect){background:#DDF7E8!important;color:#075A37!important;border:2px solid #58B883!important}',
              'K light-green rule'
          )
          index = replace_once(
              index,
              '    .conflict-row[data-decision="3"] .conflict-choice[data-value="0"]:not(.feedback-correct):not(.feedback-incorrect){background:#174A8B!important;color:#FFFFFF!important;border:2px solid #0A2E5C!important}',
              '    .conflict-row[data-decision="3"] .conflict-choice[data-value="0"]:not(.feedback-correct):not(.feedback-incorrect){background:#0B5D3B!important;color:#FFFFFF!important;border:2px solid #063B27!important}',
              'L dark-green rule'
          )
          index = replace_once(index, 'matching-tutorial.js?v=20260731-4', 'matching-tutorial.js?v=20260731-5', 'tutorial cache key')
          index_path.write_text(index, encoding='utf-8')

          tutorial_path = Path('matching-tutorial.js')
          tutorial = tutorial_path.read_text(encoding='utf-8')
          replacements = [
              ('      .matching-tutorial-key.green{background:#E9F8EF;color:#086B3A;border-color:#55A879}', '      .matching-tutorial-key.statement-yes-blue{background:#D9F0FF;color:#08385F;border-color:#5AB5E6}', 'tutorial A/D/H style'),
              ('      .matching-tutorial-key.statement-purple{background:#5B21B6;color:#FFFFFF;border-color:#3B0764}', '      .matching-tutorial-key.statement-no-blue{background:#123A6D;color:#FFFFFF;border-color:#082A52}', 'tutorial S/F/J style'),
              ('      .matching-tutorial-key.icy-blue{background:#D7F2FF;color:#08385F;border-color:#58B8E8}', '      .matching-tutorial-key.light-green{background:#DDF7E8;color:#075A37;border-color:#58B883}', 'tutorial K style'),
              ('      .matching-tutorial-key.ocean-blue{background:#174A8B;color:#FFFFFF;border-color:#0A2E5C}', '      .matching-tutorial-key.dark-green{background:#0B5D3B;color:#FFFFFF;border-color:#063B27}', 'tutorial L style'),
              ('          <p>During the first N setup cards there is no target card yet. On those setup cards, all four N-back answers are NO: use the dark-purple S, F and J buttons, plus the light-purple N button. You still solve the current-card logic question with icy-blue K for YES or dark-ocean-blue L for NO.</p>', '          <p>During the first N setup cards there is no target card yet. On those setup cards, all four N-back answers are NO: use the dark-blue S, F and J buttons, plus the light-purple N button. You still solve the current-card logic question with light-green K for YES or dark-green L for NO.</p>', 'setup colour explanation'),
              ('            <div class="matching-tutorial-key green"><strong>A · D · H</strong><br>GREEN = THIS STATEMENT MATCHES</div>', '            <div class="matching-tutorial-key statement-yes-blue"><strong>A · D · H</strong><br>LIGHT BLUE = THIS STATEMENT MATCHES</div>', 'A/D/H legend'),
              ('            <div class="matching-tutorial-key statement-purple"><strong>S · F · J</strong><br>DARK PURPLE = THIS STATEMENT DOES NOT MATCH</div>', '            <div class="matching-tutorial-key statement-no-blue"><strong>S · F · J</strong><br>DARK BLUE = THIS STATEMENT DOES NOT MATCH</div>', 'S/F/J legend'),
              ('            <div class="matching-tutorial-key icy-blue"><strong>K</strong><br>ICY BLUE = STATEMENT 3 IS EXACTLY ENTAILED</div>', '            <div class="matching-tutorial-key light-green"><strong>K</strong><br>LIGHT GREEN = STATEMENT 3 IS EXACTLY ENTAILED</div>', 'K legend'),
              ('            <div class="matching-tutorial-key ocean-blue"><strong>L</strong><br>DARK OCEAN BLUE = STATEMENT 3 IS NOT ENTAILED</div>', '            <div class="matching-tutorial-key dark-green"><strong>L</strong><br>DARK GREEN = STATEMENT 3 IS NOT ENTAILED</div>', 'L legend'),
              ('          <p><strong>Each colour has one fixed job.</strong> Green A/D/H and dark-purple S/F/J answer the three statement-match questions. Icy-blue K and dark-ocean-blue L answer the current-card entailment question. Deep-purple SPACEBAR and light-purple N answer the complete-triad question.</p>', '          <p><strong>Each colour has one fixed job.</strong> Light-blue A/D/H and dark-blue S/F/J answer the three statement-match questions. Light-green K and dark-green L answer the current-card entailment question. Deep-purple SPACEBAR and light-purple N answer the complete-triad question.</p>', 'fixed jobs paragraph'),
              ('          <div class="matching-tutorial-callout"><strong>Do not use colour alone as a shortcut.</strong> YES has different colours for different questions: green for a statement match, icy blue for correct entailment, and dark purple for a complete-triad match.</div>', '          <div class="matching-tutorial-callout"><strong>Do not use colour alone as a shortcut.</strong> YES has different colours for different questions: light blue for a statement match, light green for correct entailment, and dark purple for a complete-triad match.</div>', 'colour shortcut warning'),
              ('            <li>Use the green A, D or H button when that current statement matches under the shared alignment; use the dark-purple S, F or J button when it does not.</li>', '            <li>Use the light-blue A, D or H button when that current statement matches under the shared alignment; use the dark-blue S, F or J button when it does not.</li>', 'statement response instruction'),
              ('          <h3>The icy-blue K / dark-ocean-blue L question: is Statement 3 the exact end-to-end conclusion?</h3>', '          <h3>The light-green K / dark-green L question: is Statement 3 the exact end-to-end conclusion?</h3>', 'K/L heading'),
              ('          <p>The icy-blue K / dark-ocean-blue L pair does not decide the complete-triad answer. It checks the current card’s end-to-end logic. The dark-purple SPACEBAR / light-purple N pair checks whether the current three-statement structure matches the N-back card.</p>', '          <p>The light-green K / dark-green L pair does not decide the complete-triad answer. It checks the current card’s end-to-end logic. The dark-purple SPACEBAR / light-purple N pair checks whether the current three-statement structure matches the N-back card.</p>', 'complete-triad colour explanation')
          ]
          for old, new, label in replacements:
              tutorial = replace_once(tutorial, old, new, label)
          tutorial_path.write_text(tutorial, encoding='utf-8')

          test_path = Path('tests/matching-tutorial-logic.test.js')
          test = test_path.read_text(encoding='utf-8')
          old_test_block = '''assert.match(tutorialSource, /matching-tutorial-key green/);
assert.match(tutorialSource, /matching-tutorial-key statement-purple/);
assert.match(tutorialSource, /matching-tutorial-key light-purple/);
assert.match(tutorialSource, /matching-tutorial-key icy-blue/);
assert.match(tutorialSource, /matching-tutorial-key ocean-blue/);
assert.match(tutorialSource, /matching-tutorial-key dark-purple/);
assert.match(tutorialSource, /background:#5B21B6;color:#FFFFFF;border-color:#3B0764/);
assert.match(tutorialSource, /background:#D7F2FF;color:#08385F;border-color:#58B8E8/);
assert.match(tutorialSource, /background:#174A8B;color:#FFFFFF;border-color:#0A2E5C/);
assert.match(tutorialSource, /background:#4C1D95;color:#FFFFFF;border-color:#2E1065/);
assert.match(tutorialSource, /DARK PURPLE = THIS STATEMENT DOES NOT MATCH/);
assert.match(tutorialSource, /LIGHT PURPLE = THE WHOLE TRIAD DOES NOT MATCH/);
assert.match(tutorialSource, /DEEP PURPLE = THE WHOLE TRIAD MATCHES/);'''
          new_test_block = '''assert.match(tutorialSource, /matching-tutorial-key statement-yes-blue/);
assert.match(tutorialSource, /matching-tutorial-key statement-no-blue/);
assert.match(tutorialSource, /matching-tutorial-key light-purple/);
assert.match(tutorialSource, /matching-tutorial-key light-green/);
assert.match(tutorialSource, /matching-tutorial-key dark-green/);
assert.match(tutorialSource, /matching-tutorial-key dark-purple/);
assert.match(tutorialSource, /background:#D9F0FF;color:#08385F;border-color:#5AB5E6/);
assert.match(tutorialSource, /background:#123A6D;color:#FFFFFF;border-color:#082A52/);
assert.match(tutorialSource, /background:#DDF7E8;color:#075A37;border-color:#58B883/);
assert.match(tutorialSource, /background:#0B5D3B;color:#FFFFFF;border-color:#063B27/);
assert.match(tutorialSource, /background:#4C1D95;color:#FFFFFF;border-color:#2E1065/);
assert.match(tutorialSource, /LIGHT BLUE = THIS STATEMENT MATCHES/);
assert.match(tutorialSource, /DARK BLUE = THIS STATEMENT DOES NOT MATCH/);
assert.match(tutorialSource, /LIGHT GREEN = STATEMENT 3 IS EXACTLY ENTAILED/);
assert.match(tutorialSource, /DARK GREEN = STATEMENT 3 IS NOT ENTAILED/);
assert.match(tutorialSource, /LIGHT PURPLE = THE WHOLE TRIAD DOES NOT MATCH/);
assert.match(tutorialSource, /DEEP PURPLE = THE WHOLE TRIAD MATCHES/);'''
          test = replace_once(test, old_test_block, new_test_block, 'tutorial palette assertions')
          test_path.write_text(test, encoding='utf-8')
          PY

      - name: Validate syntax, tutorial logic, and isolated CSS selectors
        run: |
          node --check matching-tutorial.js
          node tests/matching-tutorial-logic.test.js
          grep -F 'background:#D9F0FF!important;color:#08385F!important;border:2px solid #5AB5E6!important' index.html
          grep -F 'background:#123A6D!important;color:#FFFFFF!important;border:2px solid #082A52!important' index.html
          grep -F 'background:#DDF7E8!important;color:#075A37!important;border:2px solid #58B883!important' index.html
          grep -F 'background:#0B5D3B!important;color:#FFFFFF!important;border:2px solid #063B27!important' index.html
          grep -F 'matching-tutorial.js?v=20260731-5' index.html
          git diff --check

      - name: Commit palette update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html matching-tutorial.js tests/matching-tutorial-logic.test.js
          git commit -m 'Recolour response buttons with blue and green pairs'
          git push origin HEAD:main
