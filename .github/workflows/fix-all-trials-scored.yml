name: Fix all Mode 1 trials scoring

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-all-trials-scored.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repair Mode 1 lifecycle
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('mode-one-conflict-matrix-v20.js')
          s = p.read_text()
          s = s.replace("Object.assign(trial,{mode:0,publicMode:1,nBackWarmup:true,scored:false}); return trial;", "const entailment=requireCore().evaluateTrial(trial); Object.assign(trial,{mode:0,publicMode:1,nBackWarmup:true,scored:true,nBackRequestedMatch:false,nBackMatch:false,isMatch:false,statementMatchVector:[false,false,false],conclusionEntailed:entailment.isEntailed,conflictResponseVector:[false,false,false,entailment.isEntailed,false],mappingConflict:false,localStatementCompatibility:[false,false,false],roleSensitive:false,interferenceProfile:`000:${Number(entailment.isEntailed)}:0`}); return trial;")
          s = s.replace("if(targetIndex<0) return Object.freeze({warmup:true,scored:false,isMatch:false,currentIndex,targetIndex,nBackLevel:level});", "if(targetIndex<0){ const current=history[currentIndex], entailment=requireCore().evaluateTrial(current); return Object.freeze({warmup:true,scored:true,isMatch:false,currentIndex,targetIndex,nBackLevel:level,statementMatches:Object.freeze([false,false,false]),conclusionEntailed:entailment.isEntailed,wholeTrialMatch:false,responseVector:Object.freeze([false,false,false,entailment.isEntailed,false])}); }")
          s = s.replace("const scored=isModeOne&&Boolean(trial?.scored);", "const scored=isModeOne&&Boolean(trial); if(scored&&!Array.isArray(trial.conflictResponseVector)){ const entailment=requireCore().evaluateTrial(trial); Object.assign(trial,{scored:true,statementMatchVector:[false,false,false],conclusionEntailed:entailment.isEntailed,conflictResponseVector:[false,false,false,entailment.isEntailed,false],nBackMatch:false,isMatch:false}); }")
          s = s.replace("this.awaiting=Boolean(trial.scored);", "if(!Array.isArray(trial.conflictResponseVector)){ const entailment=requireCore().evaluateTrial(trial); Object.assign(trial,{scored:true,statementMatchVector:[false,false,false],conclusionEntailed:entailment.isEntailed,conflictResponseVector:[false,false,false,entailment.isEntailed,false],nBackMatch:false,isMatch:false}); } this.awaiting=true;")
          s = s.replace("return Object.freeze({version:37,", "return Object.freeze({version:38,")
          p.write_text(s)
          PY
      - name: Add lifecycle contract test
        shell: bash
        run: |
          cat > mode-one-all-trials-scored.contract.test.js <<'EOF'
          'use strict';
          const fs=require('fs');
          const source=fs.readFileSync('mode-one-conflict-matrix-v20.js','utf8');
          const required=[
            'nBackWarmup:true,scored:true',
            'conflictResponseVector:[false,false,false,entailment.isEntailed,false]',
            'this.awaiting=true',
            'if(responses[index]!==null)return',
            'showButtonFeedback(button,responses[index]===expected)'
          ];
          for(const token of required){ if(!source.includes(token)) throw new Error(`Missing contract: ${token}`); }
          if(source.includes('nBackWarmup:true,scored:false')) throw new Error('Warm-up trials still disabled.');
          if(source.includes('this.awaiting=Boolean(trial.scored)')) throw new Error('Awaiting still gated by scored flag.');
          console.log('All Mode 1 trials expose five independently scored decisions.');
          EOF
          node mode-one-all-trials-scored.contract.test.js
      - name: Commit repaired implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mode-one-conflict-matrix-v20.js mode-one-all-trials-scored.contract.test.js
          git diff --cached --quiet && exit 0
          git commit -m 'Score all five Mode 1 decisions on every trial'
          git push
