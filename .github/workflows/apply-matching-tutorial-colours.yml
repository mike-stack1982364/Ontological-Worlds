name: Apply Matching Tutorial colour sync

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-matching-tutorial-colours.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Synchronise tutorial colours with live response buttons
        run: |
          python - <<'PY'
          from pathlib import Path

          tutorial_path = Path('matching-tutorial.js')
          source = tutorial_path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one occurrence, found {count}.')
              source = source.replace(old, new, 1)

          replace_once(
              '      .matching-tutorial-keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0}',
              '      .matching-tutorial-keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;margin:14px 0}',
              'legend grid'
          )
          replace_once(
              '''      .matching-tutorial-key.green{background:#e9f8ef;color:#086b3a;border-color:#55a879}\n      .matching-tutorial-key.purple{background:#f1e4ff;color:#6818a5;border-color:#b96af4}\n      .matching-tutorial-key.blue{background:#174a8b;color:#fff;border-color:#0a2e5c}''',
              '''      .matching-tutorial-key.green{background:#E9F8EF;color:#086B3A;border-color:#55A879}\n      .matching-tutorial-key.light-purple{background:#F1E4FF;color:#6818A5;border-color:#B96AF4}\n      .matching-tutorial-key.icy-blue{background:#D7F2FF;color:#08385F;border-color:#58B8E8}\n      .matching-tutorial-key.ocean-blue{background:#174A8B;color:#FFFFFF;border-color:#0A2E5C}\n      .matching-tutorial-key.dark-purple{background:#4C1D95;color:#FFFFFF;border-color:#2E1065}''',
              'legend colour classes'
          )
          replace_once(
              '          <p>During the first N setup cards there is no target card yet. On those setup cards, all four N-back answers are NO: use S, F, J and N. You still solve the blue K/L question from the current card.</p>',
              '          <p>During the first N setup cards there is no target card yet. On those setup cards, all four N-back answers are NO: use the light-purple S, F, J and N buttons. You still solve the current-card logic question with icy-blue K for YES or dark-ocean-blue L for NO.</p>',
              'setup-card colours'
          )
          replace_once(
              '''          <div class="matching-tutorial-keys">\n            <div class="matching-tutorial-key green">GREEN = YES<br>A · D · H · SPACEBAR</div>\n            <div class="matching-tutorial-key purple">PURPLE = NO<br>S · F · J · N</div>\n            <div class="matching-tutorial-key blue">BLUE = EXACT END-TO-END CONCLUSION?<br>K = YES · L = NO</div>\n          </div>\n          <p>The green and purple buttons compare the current card with the N-back card. The blue buttons ignore the old card and test Statement 3 using only the current card’s two clues.</p>''',
              '''          <div class="matching-tutorial-keys">\n            <div class="matching-tutorial-key green"><strong>A · D · H</strong><br>GREEN = THIS STATEMENT MATCHES</div>\n            <div class="matching-tutorial-key light-purple"><strong>S · F · J · N</strong><br>LIGHT PURPLE = NO MATCH</div>\n            <div class="matching-tutorial-key icy-blue"><strong>K</strong><br>ICY BLUE = STATEMENT 3 IS EXACTLY ENTAILED</div>\n            <div class="matching-tutorial-key ocean-blue"><strong>L</strong><br>DARK OCEAN BLUE = STATEMENT 3 IS NOT ENTAILED</div>\n            <div class="matching-tutorial-key dark-purple"><strong>SPACEBAR</strong><br>DARK PURPLE = THE WHOLE TRIAD MATCHES</div>\n          </div>\n          <p><strong>Each colour has one fixed job.</strong> Green A/D/H and light-purple S/F/J answer the three statement-match questions. Icy-blue K and dark-ocean-blue L answer the current-card entailment question. Dark-purple SPACEBAR and light-purple N answer the complete-triad question.</p>\n          <div class="matching-tutorial-callout"><strong>Do not use colour alone as a shortcut.</strong> YES has different colours for different questions: green for a statement match, icy blue for correct entailment, and dark purple for a complete-triad match.</div>''',
              'legend content'
          )
          replace_once(
              '            <li>Use green for each current statement that matches under this shared alignment; use purple for each one that does not.</li>',
              '            <li>Use the green A, D or H button when that current statement matches under the shared alignment; use the light-purple S, F or J button when it does not.</li>',
              'statement colour instruction'
          )
          replace_once(
              '          <h3>The blue K/L question: is Statement 3 the exact end-to-end conclusion?</h3>',
              '          <h3>The icy-blue K / dark-ocean-blue L question: is Statement 3 the exact end-to-end conclusion?</h3>',
              'entailment heading'
          )
          replace_once(
              '          <p>Press <strong>SPACEBAR</strong> only when all three statement matches are YES under one consistent mapping and one allowed premise pairing. Press <strong>N</strong> when even one statement fails.</p>',
              '          <p>Press the <strong>dark-purple SPACEBAR</strong> only when all three statement matches are YES under one consistent mapping and one allowed premise pairing. Press the <strong>light-purple N</strong> when even one statement fails.</p>',
              'whole-triad colour instruction'
          )
          replace_once(
              '          <p>K/L does not decide the complete-triad answer. K/L checks the current card’s end-to-end logic; SPACEBAR/N checks whether the current three-statement structure matches the N-back card.</p>',
              '          <p>The icy-blue K / dark-ocean-blue L pair does not decide the complete-triad answer. It checks the current card’s end-to-end logic. The dark-purple SPACEBAR / light-purple N pair checks whether the current three-statement structure matches the N-back card.</p>',
              'colour-pair distinction'
          )

          tutorial_path.write_text(source, encoding='utf-8')

          test_path = Path('tests/matching-tutorial-logic.test.js')
          tests = test_path.read_text(encoding='utf-8')
          anchor = "assert.match(tutorialSource, /exact end-to-end conclusion/);"
          additions = """assert.match(tutorialSource, /matching-tutorial-key green/);\nassert.match(tutorialSource, /matching-tutorial-key light-purple/);\nassert.match(tutorialSource, /matching-tutorial-key icy-blue/);\nassert.match(tutorialSource, /matching-tutorial-key ocean-blue/);\nassert.match(tutorialSource, /matching-tutorial-key dark-purple/);\nassert.match(tutorialSource, /background:#D7F2FF;color:#08385F;border-color:#58B8E8/);\nassert.match(tutorialSource, /background:#174A8B;color:#FFFFFF;border-color:#0A2E5C/);\nassert.match(tutorialSource, /background:#4C1D95;color:#FFFFFF;border-color:#2E1065/);\nassert.match(tutorialSource, /DARK PURPLE = THE WHOLE TRIAD MATCHES/);\nassert.doesNotMatch(tutorialSource, /GREEN = YES<br>A · D · H · SPACEBAR/);\nassert.doesNotMatch(tutorialSource, /BLUE = EXACT END-TO-END CONCLUSION/);"""
          if tests.count(anchor) != 1:
              raise SystemExit('Test insertion anchor was not unique.')
          tests = tests.replace(anchor, anchor + '\n' + additions, 1)
          tests = tests.replace('  colourMappingsAudited: 5,\n', '')
          tests = tests.replace("  buttonWidthUnchanged: 'min(100%,620px)'", "  buttonWidthUnchanged: 'min(100%,620px)',\n  colourMappingsAudited: 5")
          test_path.write_text(tests, encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          old_loader = '<script src="matching-tutorial.js?v=20260731-2"></script>'
          new_loader = '<script src="matching-tutorial.js?v=20260731-3"></script>'
          if index.count(old_loader) != 1:
              raise SystemExit('Expected one Matching Tutorial v2 loader.')
          index_path.write_text(index.replace(old_loader, new_loader, 1), encoding='utf-8')
          PY
      - name: Validate the isolated tutorial update
        run: |
          node --check matching-tutorial.js
          node tests/matching-tutorial-logic.test.js
          grep -F 'matching-tutorial-key icy-blue' matching-tutorial.js
          grep -F 'matching-tutorial-key ocean-blue' matching-tutorial.js
          grep -F 'matching-tutorial-key dark-purple' matching-tutorial.js
          grep -F 'matching-tutorial.js?v=20260731-3' index.html
          git diff --check
      - name: Commit tutorial colour synchronisation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add matching-tutorial.js tests/matching-tutorial-logic.test.js index.html
          git commit -m 'Synchronise Matching Tutorial with live button colours'
          git push origin HEAD:main
